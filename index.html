<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela Lotofácil</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Cartão Amarelo - Estilo Volante */
    .cartao-lotofacil {
      background-color: #fef8b8; /* Amarelo parecido com o volante */
      border: 2px solid #e0d070;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      width: 280px;
    }

    /* Cabeçalho do Cartão */
    .cabecalho-cartao {
      text-align: center;
      color: #800020; /* Cor vinho */
      margin-bottom: 20px;
      border-bottom: 1px dashed #e0d070;
      padding-bottom: 10px;
    }

    .cabecalho-cartao h2 {
      margin: 0 0 5px 0;
      font-size: 18px;
      text-transform: uppercase;
    }

    .cabecalho-cartao p {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
    }

    /* Grid com 5 colunas */
    .grid-numeros {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px 10px; /* Espaçamento entre as dezenas */
      justify-items: center;
    }

    /* Retângulos dos Números */
    .numero {
      width: 40px;
      height: 45px;
      background-color: #ffffff;
      border: 1.5px solid #800020; /* Borda cor vinho/magenta da imagem */
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #800020; /* Texto cor vinho */
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    /* Efeito ao passar o mouse */
    .numero:hover {
      background-color: #f0f0f0;
    }

    /* Estilo do Número Selecionado */
    .numero.selecionado {
      background-color: #800020;
      color: #ffffff;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
    }

    /* Painel Informativo */
    .painel-info {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .status-alerta {
      color: #d9534f;
      font-size: 14px;
      margin-top: 5px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="cartao-lotofacil">
    <!-- Cabeçalho adicionado no topo -->
    <div class="cabecalho-cartao">
      <h2>Selecione 15 números</h2>
      <p>Valor de cada jogo R$ 4,00</p>
    </div>

    <div class="grid-numeros" id="gridNumeros">
      <!-- Os números de 01 a 25 serão gerados dinamicamente via JS -->
    </div>
  </div>

  <div class="painel-info">
    <div>Números selecionados: <span id="contador">0</span> / 15</div>
    <div class="status-alerta" id="mensagemAlerta"></div>
  </div>

  <script>
    const gridNumeros = document.getElementById('gridNumeros');
    const contador = document.getElementById('contador');
    const mensagemAlerta = document.getElementById('mensagemAlerta');
    
    let selecionados = [];
    const MAX_SELECAO = 15;

    // Gerar números de 01 a 25
    for (let i = 1; i <= 25; i++) {
      const numDiv = document.createElement('div');
      numDiv.classList.add('numero');
      
      // Formata o número com zero à esquerda (ex: 01, 02... 10)
      const numeroFormatado = i < 10 ? `0${i}` : `${i}`;
      numDiv.textContent = numeroFormatado;
      
      // Adiciona o evento de clique
      numDiv.addEventListener('click', () => alternarNumero(numDiv, numeroFormatado));
      
      gridNumeros.appendChild(numDiv);
    }

    // Função para marcar/desmarcar o número
    function alternarNumero(elemento, numero) {
      mensagemAlerta.textContent = ''; // Limpa alertas anteriores

      if (selecionados.includes(numero)) {
        // Desmarcar número
        selecionados = selecionados.filter(n => n !== numero);
        elemento.classList.remove('selecionado');
      } else {
        // Tentar marcar número
        if (selecionados.length < MAX_SELECAO) {
          selecionados.push(numero);
          elemento.classList.add('selecionado');
        } else {
          // Limite de 15 alcançado
          mensagemAlerta.textContent = 'Você já selecionou o limite máximo de 15 números!';
        }
      }

      // Atualiza o contador
      contador.textContent = selecionados.length;
    }
  </script>

</body>
</html>
